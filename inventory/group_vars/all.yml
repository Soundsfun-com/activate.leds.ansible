inventory_vars_loaded: true
canary_sites:
  - warehouse
activate_agent_ref: main
# Every claimed Pi is ACT-LED-Pi; every unclaimed one ACT-LED-Pi-Unclaimed
# (roles/base defaults). One Pi per store, so a fixed name lets the store's
# Activate server send webhooks to the same address everywhere — see
# ansible/CLAUDE.md "Pi hostnames". Was ACT-LED-Pi-<Store> 2026-09-22..28.
# Empty string = disable all renaming fleet-wide.
activate_hostname_pattern: ACT-LED-Pi
cloudflared_version: 2026.7.3
auto_apply_security_patches: true
maintenance_window_start_hour: 3
maintenance_window_end_hour: 5
ansible_pull_oncalendar: '*-*-* 02:00:00'
