# Inventory for the Activate WLED fleet.
#
# ⚠️ THE NAME LIES, AND ON PURPOSE. There are no "28 stores" in here — there are
# ZERO hosts, and there never have been. The filename is load-bearing: every Pi
# image bakes `--inventory inventory/28-stores.yml` into
# activate-ansible-pull.service, so renaming this file breaks convergence on the
# whole fleet until each Pi is re-flashed. Leave the name; read this comment.
#
# WHAT THIS FILE ACTUALLY DOES: almost nothing except anchor the location of
# group_vars/ and host_vars/. `playbooks/site.yml` targets `hosts: localhost`
# (each Pi converges ITSELF via ansible-pull), so the play runs against Ansible's
# IMPLICIT localhost. Verified 2026-07-26 against ansible-core 2.15:
#   * group_vars/all.yml DOES apply to implicit localhost, despite the
#     "implicit localhost does not match 'all'" warning. Fleet-wide pins work.
#   * host_vars/<slug>.yml does NOT. The running host is `localhost`, not
#     `activate-<slug>`, so per-site pins written by the dashboard's
#     firmware.pinSite are committed and then never read by anything.
#
# So per-site pinning is not "rarely used" — it is non-functional. Making it work
# needs the play to learn its own site slug (agent.toml has `site_slug`) and
# include_vars that file explicitly; that's a design change, not a config tweak.
#
# The groups below are likewise inert: the earlier plan was for the dashboard's
# Add Location flow to append host entries here, and no code was ever written to
# do it. They're kept because group_vars/canary.yml references the canary group.

all:
  children:
    site_agents:
      vars:
        agent_mode: site
      hosts:
        # Populated by the dashboard's Add Location flow.
        # Example shape:
        #   activate-alpharetta:
        #     site_slug: alpharetta
        #     timezone: America/New_York

    portable_flashers:
      vars:
        agent_mode: portable
      hosts:
        # Populated when a flasher is registered in /firmware/recovery/flashers.

    canary:
      # Pis in this group pick up changes from group_vars/canary.yml BEFORE
      # the change is promoted to group_vars/all.yml. Used for staged rollouts.
      hosts: {}
