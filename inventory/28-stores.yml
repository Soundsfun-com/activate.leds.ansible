# Inventory for the Activate WLED fleet.
#
# ⚠️ THE NAME LIES, AND ON PURPOSE. There are no "28 stores" in here — there are
# ZERO hosts, and there never have been. The filename is load-bearing: every Pi
# image bakes `--inventory inventory/28-stores.yml` into
# activate-ansible-pull.service, so renaming this file breaks convergence on the
# whole fleet until each Pi is re-flashed. Leave the name; read this comment.
#
# WHAT THIS FILE ACTUALLY DOES: almost nothing except anchor the location of
# group_vars/ and host_vars/. `playbooks/site.yml` targets `hosts: localhost`
# (each Pi converges ITSELF via ansible-pull), so the play runs against Ansible's
# IMPLICIT localhost, which matches no inventory host and belongs to no group —
# group_vars/all.yml is the only vars file Ansible itself ever hands it.
#
# UPDATE 2026-07-28: per-site pins and canary ARE live, as of the
# `site-identity` role (commit 3cbe924, the day after the paragraph above was
# first written — this file just never got corrected). That role reads
# `site_slug` out of agent.toml and hand-includes canary.yml / host_vars/
# <slug>.yml itself, working around the implicit-localhost limitation rather
# than needing Ansible's native inventory matching. See ansible/CLAUDE.md
# ("How a Pi knows which store it is") for the precedence order. Per-site
# pins written by the dashboard's firmware.pinSite DO get read now.
#
# The groups below remain inert: the earlier plan was for the dashboard's
# Add Location flow to append host entries here, and no code was ever written
# to do it. Left in place only because group_vars/canary.yml's name references
# the canary group — site-identity doesn't need it to exist.

all:
  children:
    site_agents:
      vars:
        agent_mode: site
      hosts:
        # Populated by the dashboard's Add Location flow.
        # Example shape:
        #   activate-alpharetta:
        #     site_slug: alpharetta
        #     timezone: America/New_York

    portable_flashers:
      vars:
        agent_mode: portable
      hosts:
        # Populated when a flasher is registered in /firmware/recovery/flashers.

    canary:
      # Pis in this group pick up changes from group_vars/canary.yml BEFORE
      # the change is promoted to group_vars/all.yml. Used for staged rollouts.
      hosts: {}
