---
# activate-agent role — clones Soundsfun-com/activate.leds.agent at the pinned
# ref, installs Python deps into the pre-baked venv, writes the systemd unit,
# restarts on change.
#
# Auth: SSH via the read-only deploy key at /etc/ansible/agent-deploy-key
# (baked into the pi-gen image; injected from secrets.AGENT_DEPLOY_KEY in CI).

- name: Ensure agent dir exists
  ansible.builtin.file:
    path: "{{ activate_agent_dir }}"
    state: directory
    owner: activate-wled
    group: activate-wled
    mode: "0755"

- name: Verify deploy key is present on disk
  ansible.builtin.stat:
    path: "{{ activate_agent_ssh_key }}"
  register: deploy_key_stat
  failed_when: not deploy_key_stat.stat.exists

- name: Mark agent checkout as safe for root's git
  # Git >= 2.35 refuses to operate on a repo whose .git dir is owned by a
  # different user than the one invoking git — bails with "fatal: detected
  # dubious ownership in repository at <path>" before doing anything else.
  # Since we clone as root then chown to activate-wled, the SECOND run of
  # this role would trip the check (first run is fine — git creates the
  # checkout fresh as root). Whitelist the checkout in root's global git
  # config so subsequent updates work as root. Idempotent.
  community.general.git_config:
    name: safe.directory
    value: "{{ activate_agent_checkout }}"
    scope: global
    state: present

- name: Clone or update agent code at the pinned ref
  # Runs as root, NOT as activate-wled — because:
  #   1. The deploy key at /etc/ansible/agent-deploy-key is root-only (0600).
  #   2. /root/.ssh/known_hosts (where the SSH host keys live) sits inside
  #      /root which is mode 0750 — only root can traverse it.
  # A subsequent chown task hands ownership of the checkout to activate-wled
  # so the systemd unit (which DOES run as activate-wled) can read the code.
  ansible.builtin.git:
    repo: "{{ activate_agent_repo }}"
    dest: "{{ activate_agent_checkout }}"
    version: "{{ activate_agent_ref }}"
    force: yes
    key_file: "{{ activate_agent_ssh_key }}"
  environment:
    GIT_SSH_COMMAND: "ssh -i {{ activate_agent_ssh_key }} -o IdentitiesOnly=yes -o UserKnownHostsFile=/root/.ssh/known_hosts -o StrictHostKeyChecking=yes"
  register: agent_checkout
  notify: restart-activate-wled-agent

- name: Hand ownership of the checkout to activate-wled
  # The clone happened as root; the systemd unit runs the agent as
  # activate-wled. The user needs read on every file + execute (search)
  # on every directory under the checkout. Default file modes (0644 / 0755)
  # are world-readable, so this chown is belt-and-suspenders — keeps the
  # checkout consistent with what was always-intended.
  ansible.builtin.file:
    path: "{{ activate_agent_checkout }}"
    state: directory
    owner: activate-wled
    group: activate-wled
    recurse: yes

- name: Install/update Python deps when requirements.txt changed
  # Also runs as root (same reason — needs to write into the venv which
  # may be root-created on first run). Venv files end up root-owned but
  # mode 0644 / 0755, readable by activate-wled at runtime.
  ansible.builtin.pip:
    requirements: "{{ activate_agent_checkout }}/requirements.txt"
    virtualenv: "{{ activate_agent_venv }}"
    virtualenv_command: /usr/bin/python3 -m venv
  when: agent_checkout.changed
  notify: restart-activate-wled-agent

- name: Hand ownership of the venv to activate-wled
  # Same logic as the checkout chown — the agent runs as activate-wled and
  # benefits from owning its virtualenv (means `pip install` from inside
  # the venv at runtime would work without sudo, useful for debug).
  ansible.builtin.file:
    path: "{{ activate_agent_venv }}"
    state: directory
    owner: activate-wled
    group: activate-wled
    recurse: yes
  when: agent_checkout.changed

- name: Grant activate-wled access to systemd-journal for /system/logs
  # The agent's /api/v1/system/logs endpoint shells out to `journalctl -u
  # activate-wled-agent` so the dashboard can pull recent log lines without
  # SSH. journalctl as a non-root user requires `systemd-journal` group
  # membership to read other units' journals (including its own when running
  # under systemd's restricted scope). Append-only group change; the
  # restart handler picks up the new gid on the next service restart so
  # the running process actually inherits read permissions.
  ansible.builtin.user:
    name: activate-wled
    groups: systemd-journal
    append: yes
  notify: restart-activate-wled-agent

- name: Install sudoers drop-in for agent-managed privileged commands
  # The agent runs as activate-wled with NoNewPrivileges=true. A narrow
  # NOPASSWD whitelist gives the /api/v1/system/update-* endpoints
  # (PLAN §7.3.3) the privileges they need WITHOUT granting general
  # root — every line in this file maps to one exact argv the agent
  # passes through `sudo`. If you add a new endpoint that needs sudo,
  # update both the file and agent/system_updater.py's UPDATE_COMMANDS
  # map; mismatches surface as silent permission denials.
  #
  # `validate:` runs visudo -cf against a temp copy before installing —
  # this prevents a malformed drop-in from breaking sudo entirely
  # (which would lock us out of *every* future ansible-pull's
  # become: yes).
  ansible.builtin.copy:
    src: activate-wled-system.sudoers
    dest: /etc/sudoers.d/activate-wled-system
    owner: root
    group: root
    # 0440 is the only mode sudo accepts — anything else and sudo
    # silently skips the file.
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Install activate-wled-agent.service systemd unit
  ansible.builtin.copy:
    src: "{{ activate_agent_checkout }}/systemd/activate-wled-agent.service"
    dest: /etc/systemd/system/activate-wled-agent.service
    remote_src: yes
    owner: root
    group: root
    mode: "0644"
  notify:
    - daemon-reload
    - restart-activate-wled-agent

- name: Ensure agent service is enabled and running
  ansible.builtin.systemd:
    name: activate-wled-agent
    enabled: yes
    state: started
    daemon_reload: yes
  when: activate_agent_service_enabled

- name: Record agent checkout state for telemetry
  ansible.builtin.copy:
    dest: /var/lib/activate-wled/agent-checkout.json
    owner: activate-wled
    group: activate-wled
    mode: "0644"
    content: |
      {
        "repo": "{{ activate_agent_repo }}",
        "ref": "{{ activate_agent_ref }}",
        "checked_out_at": "{{ ansible_date_time.iso8601 }}",
        "host": "{{ inventory_hostname }}"
      }
