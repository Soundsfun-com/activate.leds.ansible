# Activate WLED — sshd hardening overrides.
# Lives in /etc/ssh/sshd_config.d/ so it layers cleanly over Pi OS defaults.
# Re-installed on every ansible-pull to repair drift.

# Auth: keys only, no passwords, no root.
PasswordAuthentication no
PermitRootLogin no
PermitEmptyPasswords no
ChallengeResponseAuthentication no
KbdInteractiveAuthentication no
UsePAM yes
PubkeyAuthentication yes

# Reduce noise + brute-force surface
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2

# AllowUsers is set via the template (so we can drive it from the var).
