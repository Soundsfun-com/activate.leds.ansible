---
# security role — baseline hardening for every Pi.
# Idempotent: re-runs are no-ops if state already matches.

# --- 1. sshd hardening ------------------------------------------------------

- name: Install sshd hardening overrides
  ansible.builtin.copy:
    src: sshd_config.d_activate-wled.conf
    dest: /etc/ssh/sshd_config.d/00-activate-wled.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart-sshd

- name: Render AllowUsers list
  ansible.builtin.template:
    src: sshd_allowusers.j2
    dest: /etc/ssh/sshd_config.d/01-activate-allowusers.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart-sshd

# --- 1b. lock the account password ------------------------------------------
# The pi-gen image ships with a placeholder password (pi-gen requires one)
# that was supposed to be "rotated by ansible" but never was — the
# 2026-07-13 Pi 5 first-boot debug used it for sudo. Lock it outright:
# access is SSH-key-only (sshd hardening above) and privileged commands go
# through the NOPASSWD sudoers whitelists. Locking beats rotating — there's
# no new secret to store or leak. Console recovery = pull the SD card.

- name: Lock the activate-wled account password
  ansible.builtin.user:
    name: activate-wled
    password_lock: yes

# --- 2. unattended-upgrades (security patches) ------------------------------

- name: Install unattended-upgrades package
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Render unattended-upgrades policy
  ansible.builtin.template:
    src: 50-unattended-upgrades-activate.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Render apt periodic settings
  ansible.builtin.template:
    src: 20-auto-upgrades-activate.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

# --- 2b. run the upgrades inside the maintenance window ---------------------
#
# Turning `auto_apply_security_patches` on is NOT sufficient on its own.
# Debian's apt-daily-upgrade.timer fires at 06:00 with up to 60 min of jitter,
# so patches would install between 6 and 7am — during opening prep, not the
# 3-5am window the policy above talks about. Worse, a patch needing a reboot
# would leave the Pi waiting until the 03:00 reboot time the NEXT night.
#
# Same systemd trap as the ansible-pull timer (see roles/base): triggers are
# OR-ed, so the baked OnCalendar must be CLEARED before setting ours or both
# apply and the 06:00 run survives.

- name: Ensure apt-daily-upgrade timer override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/apt-daily-upgrade.timer.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: auto_apply_security_patches

- name: Run unattended-upgrades inside the maintenance window
  ansible.builtin.copy:
    dest: /etc/systemd/system/apt-daily-upgrade.timer.d/activate-window.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (roles/security). Do not edit on the Pi.
      [Timer]
      OnCalendar=
      OnCalendar=*-*-* {{ "%02d:00" | format(maintenance_window_start_hour | default(3)) }}
      # Spread the fleet across the first half of the window so 28 stores don't
      # all hit the Debian mirror in the same second.
      RandomizedDelaySec={{ ((maintenance_window_end_hour | default(5)) - (maintenance_window_start_hour | default(3))) * 1800 }}
      # Catch up a run missed while the Pi was powered off. An apt run outside
      # the window is untidy; skipping security patches entirely is worse.
      Persistent=true
  when: auto_apply_security_patches
  notify: reload-apt-timer

- name: Ensure the apt upgrade timer is enabled
  ansible.builtin.systemd:
    name: apt-daily-upgrade.timer
    enabled: yes
    state: started
    daemon_reload: yes
  when: auto_apply_security_patches

# --- 3. fail2ban (SSH brute-force protection) ------------------------------

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: "{{ 'present' if fail2ban_enabled else 'absent' }}"

- name: Configure fail2ban for sshd (lightweight defaults)
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/activate-sshd.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [sshd]
      enabled = {{ fail2ban_enabled | string | lower }}
      maxretry = 5
      findtime = 10m
      bantime = 1h
  when: fail2ban_enabled
  notify: restart-fail2ban

- name: Ensure fail2ban is running
  ansible.builtin.systemd:
    name: fail2ban
    enabled: yes
    state: started
  when: fail2ban_enabled
