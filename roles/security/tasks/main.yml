---
# security role — baseline hardening for every Pi.
# Idempotent: re-runs are no-ops if state already matches.

# --- 1. sshd hardening ------------------------------------------------------

- name: Install sshd hardening overrides
  ansible.builtin.copy:
    src: sshd_config.d_activate-wled.conf
    dest: /etc/ssh/sshd_config.d/00-activate-wled.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart-sshd

- name: Render AllowUsers list
  ansible.builtin.template:
    src: sshd_allowusers.j2
    dest: /etc/ssh/sshd_config.d/01-activate-allowusers.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart-sshd

# --- 1b. lock the account password ------------------------------------------
# The pi-gen image ships with a placeholder password (pi-gen requires one)
# that was supposed to be "rotated by ansible" but never was — the
# 2026-07-13 Pi 5 first-boot debug used it for sudo. Lock it outright:
# access is SSH-key-only (sshd hardening above) and privileged commands go
# through the NOPASSWD sudoers whitelists. Locking beats rotating — there's
# no new secret to store or leak. Console recovery = pull the SD card.

- name: Lock the activate-wled account password
  ansible.builtin.user:
    name: activate-wled
    password_lock: yes

# --- 2. unattended-upgrades (security patches) ------------------------------

- name: Install unattended-upgrades package
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Render unattended-upgrades policy
  ansible.builtin.template:
    src: 50-unattended-upgrades-activate.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Render apt periodic settings
  ansible.builtin.template:
    src: 20-auto-upgrades-activate.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

# --- 3. fail2ban (SSH brute-force protection) ------------------------------

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: "{{ 'present' if fail2ban_enabled else 'absent' }}"

- name: Configure fail2ban for sshd (lightweight defaults)
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/activate-sshd.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [sshd]
      enabled = {{ fail2ban_enabled | string | lower }}
      maxretry = 5
      findtime = 10m
      bantime = 1h
  when: fail2ban_enabled
  notify: restart-fail2ban

- name: Ensure fail2ban is running
  ansible.builtin.systemd:
    name: fail2ban
    enabled: yes
    state: started
  when: fail2ban_enabled
