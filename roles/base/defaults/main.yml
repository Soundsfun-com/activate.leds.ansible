---
# Default values for the base role.
# Override in group_vars/all.yml or host_vars/<slug>.yml.

# Per-site timezone. Default is Eastern (most Activate stores).
# Override per-site in host_vars/<slug>.yml when a store is in another zone.
site_timezone: America/New_York

# Hostnames for site Pis (resolved in tasks/resolve-hostname.yml):
#
#   claimed   → activate_hostname_pattern    (fleet: "ACT-LED-Pi")
#   unclaimed → activate_unclaimed_hostname  ("ACT-LED-Pi-Unclaimed")
#
# The pattern may still contain `{{ site_hostname_slug }}` (title-cased slug,
# `american-dream` → `American-Dream`) for a per-store name; the fleet dropped
# that on 2026-09-28 so webhooks can target one name at every store.
#
# ⚠️ HYPHENS ONLY. Letters, digits and hyphens are the safe set: no spaces,
# no brackets, no underscores. `hostnamectl` rejects the first two, which
# aborts the play in `base` and leaves the Pi running but no longer updating;
# underscores get mangled by some routers' DHCP client lists.
# tests/test_hostname.sh fails the build on anything else.
#
# EMPTY PATTERN = disabled: this role then renames nothing, claimed or not.
# That is the revert path. The fleet value lives in
# inventory/group_vars/all.yml.
#
# An explicit `desired_hostname` in host_vars/<slug>.yml still wins.
activate_hostname_pattern: ""

# Must match the image's baked name (dashboard/infra/pi-image/config →
# TARGET_HOSTNAME, and .github/workflows/build-pi-image.yml → hostname:), so a
# freshly-flashed Pi is never renamed on its first pull.
activate_unclaimed_hostname: ACT-LED-Pi-Unclaimed

# Logrotate policy for /var/log/activate-wled/
activate_log_rotate_days: 14
activate_log_max_size_mb: 50

# ── ansible-pull cadence ────────────────────────────────────────────────────
#
# Applied as a systemd drop-in on /etc/systemd/system/activate-ansible-pull.timer.
# The image's baked schedule (OnBootSec=90s + OnUnitActiveSec=10min) governs only
# a Pi that has never completed a pull; this drop-in owns it from the first
# successful pull onward. Both OnCalendar and OnUnitActiveSec must be CLEARED
# before ours are set — systemd ORs triggers (CLAUDE.md Rule 2).
#
# Two branches, selected on whether the Pi has a site_slug — see
# ansible_pull_unassigned_oncalendar below and CLAUDE.md Rule 4.
#
# DON'T speed the claimed-Pi cadence up for a dev push. It widens the
# blast-radius window for a bad commit across all 28 stores, unattended, at 2am.
# Use the Edge Pis page's "Update all agents" button instead.
#
# Convergence schedule. 2am in the Pi's own timezone (see site_timezone) —
# config changes land overnight, not during trading hours. Fleet-wide pushes
# that can't wait go through the Edge Pis page's "Update all agents" button.
ansible_pull_oncalendar: "*-*-* 02:00:00"

# Jitter after the scheduled time, so the fleet doesn't hit GitHub at once.
# 2:00–2:30am local.
ansible_pull_randomized_delay: "30min"

# ── Cadence for a Pi that is NOT yet claimed by a store ─────────────────────
#
# Why unclaimed Pis get their own, much faster schedule:
#
# The pi-gen image does NOT bake the agent code — only its virtualenv. The agent
# arrives with the first ansible-pull, and nothing announces the Pi to the
# dashboard's Assign tab until that agent is running. So on a fresh Pi the
# convergence cadence literally IS the time-to-appear: at the store cadence an
# installer flashes a box and then waits for 2am.
#
# It also bounds a failure that used to be silent. `base` runs before
# `activate-agent`, so this drop-in is written before the agent exists; when it
# unconditionally wrote the daily schedule, any failure later in the play left
# a Pi with no agent AND no retry until 2am — and a Pi with no agent cannot tell
# anyone. Now it retries within minutes and heals itself.
#
# The cost is bounded: only unclaimed Pis poll this often (usually a handful on
# a bench, not the 28-store fleet), and the moment one is claimed its next pull
# writes the store cadence instead.
#
# NOTE for re-assignment: unassigning a Pi from the dashboard makes the agent
# self-unenroll (deletes agent.toml), but the timer only flips back to fast on
# its NEXT pull — which is still the store cadence. If you need a re-flashed or
# unassigned Pi back on the Assign tab now, run
# `systemctl start activate-ansible-pull.service` on it (or reboot: OnBootSec
# survives every drop-in).
ansible_pull_unassigned_oncalendar: "*:0/10"
ansible_pull_unassigned_randomized_delay: "1min"

# After a rename (and once on every Pi that has never announced), reconnect
# the network so the store router learns the current hostname — the webhook
# target ACT-LED-Pi doesn't resolve otherwise. The name last announced lives
# in activate_dhcp_state_file. Set false in host_vars/<slug>.yml to stop one
# store reconnecting at 02:00, or in all.yml to stop it everywhere.
activate_dhcp_reannounce: true
activate_dhcp_state_file: /var/lib/activate-wled/dhcp-announced-hostname
