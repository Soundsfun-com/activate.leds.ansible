---
- name: rebuild-hosts-file
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1\t{{ desired_hostname | default(ansible_hostname) }}"
    state: present

- name: reload-ansible-pull-timer
  # daemon-reload picks up the new drop-in; restart makes the next firing
  # use the updated OnCalendar. The currently-running ansible-pull (which
  # IS this very playbook) finishes normally; the new cadence kicks in on
  # the next tick.
  ansible.builtin.systemd:
    name: activate-ansible-pull.timer
    daemon_reload: true
    state: restarted

- name: reannounce-hostname-to-router
  # Detached and delayed on purpose: handlers run at the END of the play, but
  # the pull still writes its status afterwards, and a reconnect in the middle
  # of anything network-bound would fail it. systemd-run puts the helper in its
  # own transient unit, so it outlives the ansible-pull service and runs ~60s
  # later. Any earlier queued run is cleared first — systemd-run refuses to
  # reuse a unit name that still exists.
  ansible.builtin.shell: |
    systemctl stop activate-dhcp-reannounce.timer activate-dhcp-reannounce.service 2>/dev/null || true
    systemctl reset-failed activate-dhcp-reannounce.timer activate-dhcp-reannounce.service 2>/dev/null || true
    systemd-run --unit=activate-dhcp-reannounce --collect \
      --on-active=60 --timer-property=AccuracySec=1s \
      /usr/local/sbin/activate-dhcp-reannounce
