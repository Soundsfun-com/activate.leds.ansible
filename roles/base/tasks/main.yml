---
# base role — OS-level baseline that every Pi (site or flasher) should converge to.
# Idempotent: re-runs are no-ops if state already matches.

- name: Set system hostname (only when desired_hostname is explicitly set)
  # Bench Pis keep whatever Pi Imager set. Production Pis define
  # `desired_hostname` in their host_vars file during enrollment (e.g.
  # host_vars/activate-alpharetta.yml → desired_hostname: activate-alpharetta).
  # NEVER fall back to inventory_hostname — under `hosts: localhost` that's
  # literally "localhost" which would brick mDNS.
  ansible.builtin.hostname:
    name: "{{ desired_hostname }}"
    use: systemd
  when: desired_hostname is defined
  notify: rebuild-hosts-file

- name: Ensure /etc/hosts has 127.0.1.1 entry for the hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    # Use the system's actual hostname (ansible_hostname is gathered by
    # gather_facts) so /etc/hosts reflects reality regardless of whether
    # desired_hostname was set above.
    line: "127.0.1.1\t{{ desired_hostname | default(ansible_hostname) }}"
    state: present

- name: Set system timezone
  community.general.timezone:
    name: "{{ site_timezone }}"

- name: Ensure /var/log/activate-wled/ exists with correct ownership
  ansible.builtin.file:
    path: /var/log/activate-wled
    state: directory
    owner: activate-wled
    group: activate-wled
    mode: "0755"

- name: Ensure /var/lib/activate-wled/ exists (state files, marker JSON)
  ansible.builtin.file:
    path: /var/lib/activate-wled
    state: directory
    owner: activate-wled
    group: activate-wled
    mode: "0755"

- name: Install logrotate policy for /var/log/activate-wled/
  ansible.builtin.copy:
    dest: /etc/logrotate.d/activate-wled
    owner: root
    group: root
    mode: "0644"
    content: |
      /var/log/activate-wled/*.log {
          daily
          rotate {{ activate_log_rotate_days }}
          size {{ activate_log_max_size_mb }}M
          missingok
          notifempty
          compress
          delaycompress
          copytruncate
          su activate-wled activate-wled
      }

- name: Ensure ansible-pull timer override directory exists
  # The pi-gen image bakes /etc/systemd/system/activate-ansible-pull.timer
  # with OnCalendar=hourly. We override via a drop-in so the cadence is
  # ansible-managed (revertable by editing `ansible_pull_oncalendar` in
  # group_vars/all.yml and pushing). The image's RandomizedDelaySec is
  # preserved across the override — fleet doesn't stampede regardless
  # of cadence.
  ansible.builtin.file:
    path: /etc/systemd/system/activate-ansible-pull.timer.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Override ansible-pull timer cadence
  # systemd ORs every trigger on a timer, and the image bakes
  # OnBootSec=5min + OnUnitActiveSec=1h. Clearing OnCalendar alone would
  # therefore leave the HOURLY repeat in place and the new schedule would
  # look ignored — an empty `OnUnitActiveSec=` is what actually retires it.
  #
  # OnBootSec is deliberately KEPT: a Pi that was unplugged (or freshly
  # flashed) converges ~5 min after it comes up instead of waiting for the
  # next 2am.
  ansible.builtin.copy:
    dest: /etc/systemd/system/activate-ansible-pull.timer.d/cadence.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by activate.leds.ansible / roles/base.
      #
      # Cadence comes from `ansible_pull_oncalendar` in
      # inventory/group_vars/all.yml. Default is 02:00 daily, in the Pi's OWN
      # timezone (`site_timezone`) — so each store converges at 2am local,
      # while the building is empty. Push something urgent with the "Update
      # all agents" button on the Edge Pis page rather than speeding this up.
      [Timer]
      OnUnitActiveSec=
      OnCalendar=
      OnCalendar={{ ansible_pull_oncalendar }}
      # Spread the fleet so 28 stores don't hit GitHub on the same second.
      RandomizedDelaySec={{ ansible_pull_randomized_delay }}
      # Ran while the Pi was off? Converge at next boot instead of skipping.
      Persistent=true
  notify: reload-ansible-pull-timer

- name: Render MOTD with build + ansible-pull info
  ansible.builtin.copy:
    dest: /etc/motd
    owner: root
    group: root
    mode: "0644"
    content: |

      ┌──────────────────────────────────────────────────────────────┐
      │  Activate WLED Pi                                            │
      │  Host:           {{ ansible_hostname }}
      │  Site slug:      {{ site_slug | default('(unenrolled)') }}
      │  Agent mode:     {{ agent_mode | default('site') }}
      │  Timezone:       {{ site_timezone }}
      │  Last ansible:   {{ ansible_date_time.iso8601 }}
      │  ansible-pull:   {{ ansible_pull_oncalendar }} (public ansible repo)
      └──────────────────────────────────────────────────────────────┘
      Don't edit files in /opt/activate-wled-agent/ or /etc/cloudflared/
      directly — Ansible will overwrite them on the next pull.
