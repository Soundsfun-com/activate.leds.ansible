---
# base role — OS-level baseline that every Pi (site or flasher) should converge to.
# Idempotent: re-runs are no-ops if state already matches.

- name: Resolve the hostname this Pi should have
  ansible.builtin.import_tasks: resolve-hostname.yml

- name: Set system hostname (only when desired_hostname is set or derived)
  # Bench Pis and unclaimed Pis keep whatever the image / Pi Imager set.
  # NEVER fall back to inventory_hostname — under `hosts: localhost` that's
  # literally "localhost" which would brick mDNS.
  ansible.builtin.hostname:
    name: "{{ desired_hostname }}"
    use: systemd
  when: desired_hostname is defined
  notify: rebuild-hosts-file

- name: Ensure /etc/hosts has 127.0.1.1 entry for the hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    # Use the system's actual hostname (ansible_hostname is gathered by
    # gather_facts) so /etc/hosts reflects reality regardless of whether
    # desired_hostname was set above.
    line: "127.0.1.1\t{{ desired_hostname | default(ansible_hostname) }}"
    state: present

- name: Set system timezone
  community.general.timezone:
    name: "{{ site_timezone }}"

- name: Ensure /var/log/activate-wled/ exists with correct ownership
  ansible.builtin.file:
    path: /var/log/activate-wled
    state: directory
    owner: activate-wled
    group: activate-wled
    mode: "0755"

- name: Ensure /var/lib/activate-wled/ exists (state files, marker JSON)
  ansible.builtin.file:
    path: /var/lib/activate-wled
    state: directory
    owner: activate-wled
    group: activate-wled
    mode: "0755"

- name: Install logrotate policy for /var/log/activate-wled/
  ansible.builtin.copy:
    dest: /etc/logrotate.d/activate-wled
    owner: root
    group: root
    mode: "0644"
    content: |
      /var/log/activate-wled/*.log {
          daily
          rotate {{ activate_log_rotate_days }}
          size {{ activate_log_max_size_mb }}M
          missingok
          notifempty
          compress
          delaycompress
          copytruncate
          su activate-wled activate-wled
      }

- name: Ensure ansible-pull timer override directory exists
  # The pi-gen image bakes /etc/systemd/system/activate-ansible-pull.timer with
  # OnBootSec=90s + OnUnitActiveSec=10min + RandomizedDelaySec=60s — the
  # "not claimed yet" schedule. We override via a drop-in so the cadence is
  # ansible-managed (revertable by editing `ansible_pull_oncalendar` in
  # group_vars/all.yml and pushing). The drop-in REPLACES the baked
  # RandomizedDelaySec with `ansible_pull_effective_delay`; it does not inherit
  # it. OnBootSec is deliberately left alone so an unplugged or freshly-flashed
  # Pi converges shortly after it comes up instead of waiting for the window.
  ansible.builtin.file:
    path: /etc/systemd/system/activate-ansible-pull.timer.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Decide this Pi's convergence cadence (unclaimed converges fast)
  # An UNCLAIMED Pi cannot appear on the dashboard's Assign tab until a pull
  # has installed and started the agent — the pi-gen image ships only the venv,
  # not the agent code (see infra/pi-image/stage3-activate/02-agent-venv). So
  # for an unclaimed Pi the convergence cadence IS the time-to-appear, and a
  # once-a-day schedule means an installer stands there waiting until 2am.
  #
  # It also defuses an ordering latch: `base` runs BEFORE `activate-agent` in
  # site.yml, so on a fresh Pi this drop-in lands before the agent exists. When
  # the store cadence was written unconditionally, ANY failure at-or-after this
  # point (bad clone, pip, cloudflared) retired the image's hourly retry and
  # left the Pi silent until 2am — invisible, because a Pi with no agent can't
  # report anything. Writing the fast cadence while unclaimed makes that
  # self-heal within ~10 min instead.
  #
  # Claimed Pis keep the quiet 2am schedule: they are running the lights, and
  # same-day pushes go through the Edge Pis page's "Update all agents" button.
  #
  # `site_slug` is resolved by the site-identity role (first in site.yml) from
  # /etc/activate-wled/agent.toml. Deliberately the SAME expression the canary
  # and per-site-pin tasks use — two different tests of "am I claimed" that can
  # disagree is the exact seam class this repo keeps getting bitten by.
  ansible.builtin.set_fact:
    activate_pi_claimed: "{{ site_slug | default('') | length > 0 }}"
    ansible_pull_effective_oncalendar: >-
      {{ ansible_pull_oncalendar if (site_slug | default('') | length > 0)
         else ansible_pull_unassigned_oncalendar }}
    ansible_pull_effective_delay: >-
      {{ ansible_pull_randomized_delay if (site_slug | default('') | length > 0)
         else ansible_pull_unassigned_randomized_delay }}

- name: Override ansible-pull timer cadence
  # A TEMPLATE rather than inline content so tests/test_pull_cadence.sh can
  # render the real thing for both branches. The systemd OR-ing trap and the
  # reasoning for each branch live in the template's own header.
  ansible.builtin.template:
    src: ansible-pull-cadence.conf.j2
    dest: /etc/systemd/system/activate-ansible-pull.timer.d/cadence.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload-ansible-pull-timer

- name: Render MOTD with build + ansible-pull info
  ansible.builtin.copy:
    dest: /etc/motd
    owner: root
    group: root
    mode: "0644"
    content: |

      ┌──────────────────────────────────────────────────────────────┐
      │  Activate WLED Pi                                            │
      │  Host:           {{ ansible_hostname }}
      │  Site slug:      {{ site_slug | default('(unenrolled)') }}
      │  Agent mode:     {{ agent_mode | default('site') }}
      │  Timezone:       {{ site_timezone }}
      │  Last ansible:   {{ ansible_date_time.iso8601 }}
      │  ansible-pull:   {{ ansible_pull_effective_oncalendar }} ({{ 'store cadence' if activate_pi_claimed | bool else 'UNCLAIMED — fast, waiting to be assigned' }})
      └──────────────────────────────────────────────────────────────┘
      Don't edit files in /opt/activate-wled-agent/ or /etc/cloudflared/
      directly — Ansible will overwrite them on the next pull.
