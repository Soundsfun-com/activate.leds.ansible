---
# Work out what this Pi SHOULD be called. Pure computation — sets facts and
# touches nothing on the box.
#
# Split out of main.yml on purpose: applying the name needs root and systemd,
# but deciding it doesn't, so tests/test_hostname.sh can import this file and
# assert the resolved value on a laptop without renaming the laptop.
#
# THE CONVENTION (since 2026-09-28): one name for every claimed Pi, one for
# every unclaimed one.
#
#   claimed   → ACT-LED-Pi            (activate_hostname_pattern)
#   unclaimed → ACT-LED-Pi-Unclaimed  (activate_unclaimed_hostname)
#
# A store has exactly one lights Pi, so a fixed name lets the store's Activate
# game server send its webhooks to the same address at every location. The
# Pis are told apart by hardware serial + the Identify blink on the Edge Pis
# page, never by hostname. Until 2026-09-28 the claimed name was
# ACT-LED-Pi-<Store>; `site_hostname_slug` below is kept so a per-store pattern
# still works if anyone ever wants it back.

- name: Build the display form of this store's slug
  # `american-dream` → `American-Dream`. Only used if the pattern references
  # it; the fleet pattern currently doesn't.
  ansible.builtin.set_fact:
    site_hostname_slug: >-
      {{ site_slug | replace('-', ' ') | title | replace(' ', '-') }}
  when: site_slug | default('') | length > 0

- name: Name a claimed Pi
  # site-identity (which runs before this role) resolved `site_slug` from
  # agent.toml, so a slug here means "this Pi is assigned to a store".
  #
  # Precedence: an explicit `desired_hostname` in host_vars/<slug>.yml wins.
  # An empty pattern disables renaming entirely (role default, revert path).
  ansible.builtin.set_fact:
    desired_hostname: "{{ activate_hostname_pattern }}"
  when:
    - desired_hostname is not defined
    - activate_hostname_pattern | default('') | length > 0
    - site_slug | default('') | length > 0

- name: Name an unclaimed Pi
  # No slug = imaged but not assigned, or self-unenrolled after its store was
  # removed. Without this, a Pi flashed from an older image keeps
  # `activate-led-controller-pi`, and an un-enrolled one keeps the claimed name
  # and is indistinguishable from a live store Pi in a router list.
  #
  # Gated on the same pattern so an empty pattern still renames NOTHING.
  # Only site Pis run this playbook — the portable flasher image never runs
  # ansible-pull, so `activate-flasher` is never touched.
  ansible.builtin.set_fact:
    desired_hostname: "{{ activate_unclaimed_hostname }}"
  when:
    - desired_hostname is not defined
    - activate_hostname_pattern | default('') | length > 0
    - activate_unclaimed_hostname | default('') | length > 0
    - site_slug | default('') | length == 0
