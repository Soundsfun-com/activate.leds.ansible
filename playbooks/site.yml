---
# The ansible-pull target. Runs hourly on every Pi.
#
# v1 scope: base + udev-rules + security roles (OS-only convergence).
# Not yet implemented (waiting on agent-code-repo decision):
#   - cloudflared role (version pinning)
#   - activate-agent role (clone + install agent code, manage systemd unit)

- name: Activate WLED fleet convergence
  hosts: all
  become: yes
  gather_facts: yes

  pre_tasks:
    - name: Ensure /var/log/activate-wled/ exists
      ansible.builtin.file:
        path: /var/log/activate-wled
        state: directory
        owner: activate-wled
        group: activate-wled
        mode: "0755"

    - name: Ensure /var/lib/activate-wled/ exists
      ansible.builtin.file:
        path: /var/lib/activate-wled
        state: directory
        owner: activate-wled
        group: activate-wled
        mode: "0755"

    - name: Record ansible-pull start
      ansible.builtin.copy:
        dest: /var/lib/activate-wled/last-ansible-pull.json
        owner: activate-wled
        group: activate-wled
        mode: "0644"
        content: |
          {
            "started_at": "{{ ansible_date_time.iso8601 }}",
            "host": "{{ inventory_hostname }}",
            "agent_mode": "{{ agent_mode | default('site') }}",
            "playbook_repo": "Soundsfun-com/activate.leds.ansible"
          }

  roles:
    - role: base
    - role: udev-rules
    - role: security
    - role: activate-agent
    # - role: cloudflared     # TODO: tunnel version pinning

  post_tasks:
    - name: Record ansible-pull success
      ansible.builtin.lineinfile:
        path: /var/log/activate-wled/ansible-pull.log
        line: "{{ ansible_date_time.iso8601 }} pull OK host={{ inventory_hostname }}"
        create: yes
        owner: activate-wled
        group: activate-wled
        mode: "0644"
