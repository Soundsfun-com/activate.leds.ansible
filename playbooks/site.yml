---
# The ansible-pull target. Runs hourly on every Pi.
#
# Scope: base + udev-rules + security + activate-agent + cloudflared —
# full convergence (OS config, agent code ref, tunnel client version).

- name: Activate WLED fleet convergence
  # Targets `localhost` because each Pi runs `ansible-pull` against itself —
  # the inventory is for variable-scoping (host_vars / group_vars), not for
  # picking which host the play runs against. `localhost` is always in
  # ansible-pull's default --limit list, so this matches regardless of the
  # Pi's actual system hostname or whether it has an inventory entry yet.
  hosts: localhost
  connection: local
  become: yes
  gather_facts: yes

  pre_tasks:
    # FIRST, before anything converges: prove the inventory vars actually
    # loaded. They live in inventory/group_vars/, and Ansible resolves those
    # relative to the inventory or the playbook — put them anywhere else and
    # they are silently ignored. That happened: group_vars/all.yml sat at the
    # repo root for weeks, so `cloudflared_version: 2026.7.2` never reached a
    # Pi. Roles fell back to their own defaults, the versions matched what was
    # installed, every task was skipped, and each hourly run reported success
    # while the fleet stayed on the image's 2024.12.2.
    #
    # `inventory_vars_loaded` exists only in that file and has no role default,
    # so this assert is the one thing that can tell the difference between "no
    # changes needed" and "the pins never arrived".
    - name: Assert inventory vars loaded
      ansible.builtin.assert:
        that:
          - inventory_vars_loaded | default(false) | bool
        fail_msg: >-
          inventory/group_vars/all.yml did not load. Ansible reads group_vars
          next to the INVENTORY (inventory/group_vars/) or the playbook — not
          the repo root. Until this is fixed every version pin is inert and
          roles silently use their own defaults.
        success_msg: "Inventory vars loaded (cloudflared_version={{ cloudflared_version }})"
      tags: [always]

    - name: Ensure /var/log/activate-wled/ exists
      ansible.builtin.file:
        path: /var/log/activate-wled
        state: directory
        owner: activate-wled
        group: activate-wled
        mode: "0755"

    - name: Ensure /var/lib/activate-wled/ exists
      ansible.builtin.file:
        path: /var/lib/activate-wled
        state: directory
        owner: activate-wled
        group: activate-wled
        mode: "0755"

    - name: Record ansible-pull start
      ansible.builtin.copy:
        dest: /var/lib/activate-wled/last-ansible-pull.json
        owner: activate-wled
        group: activate-wled
        mode: "0644"
        # ansible_hostname = the system's actual hostname (gathered by
        # gather_facts), not the inventory entry name. Reflects reality.
        content: |
          {
            "started_at": "{{ ansible_date_time.iso8601 }}",
            "host": "{{ ansible_hostname }}",
            "agent_mode": "{{ agent_mode | default('site') }}",
            "playbook_repo": "Soundsfun-com/activate.leds.ansible"
          }

  roles:
    # FIRST, always: resolves this Pi's site slug and layers canary + per-site
    # vars on top of the fleet defaults. Every role after it reads the resolved
    # values, so it cannot be reordered without silently reverting staged
    # rollout to fleet-wide-only.
    - role: site-identity
    - role: base
    - role: udev-rules
    - role: security
    - role: activate-agent
    - role: cloudflared

  post_tasks:
    - name: Record ansible-pull success
      ansible.builtin.lineinfile:
        path: /var/log/activate-wled/ansible-pull.log
        line: "{{ ansible_date_time.iso8601 }} pull OK host={{ ansible_hostname }}"
        create: yes
        owner: activate-wled
        group: activate-wled
        mode: "0644"

    # Success is now recorded as STATE, not just a log line, so a failed pull
    # is visible rather than merely absent. Before this, a role failing (say
    # the cloudflared download losing its way out of a store's network) aborted
    # the play silently: post_tasks never ran, nothing was written, and the
    # fleet simply stopped converging with no signal anywhere. That is how the
    # cloudflared pin sat unapplied for days.
    - name: Record last successful convergence
      ansible.builtin.copy:
        dest: /var/lib/activate-wled/last-ansible-pull-ok.json
        owner: activate-wled
        group: activate-wled
        mode: "0644"
        content: |
          {
            "finished_at": "{{ ansible_date_time.iso8601 }}",
            "host": "{{ ansible_hostname }}",
            "cloudflared_version": "{{ cloudflared_version | default('unset') }}",
            "activate_agent_ref": "{{ activate_agent_ref | default('unset') }}"
          }
